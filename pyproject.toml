[project]
name = "maya-in-transit"
version = "0.1.0"
description = "Числа, расчёты и проверки вики мира Maya in Transit"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=2.0",
    "matplotlib>=3.9",
]

[tool.uv]
package = false
# Системный Python (Homebrew 3.14), а не управляемый uv.
python-preference = "system"
