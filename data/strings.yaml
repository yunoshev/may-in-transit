    project: {ru: MAYA IN TRANSIT — REF, en: MAYA IN TRANSIT — REF}
    rev: {ru: REV draft, en: REV draft}
    date: {ru: "2026-10-11", en: "2026-10-11"}
    canon_rev: {ru: "Размеры: data/canon.yaml → canon.json", en: "Dimensions: data/canon.yaml → canon.json"}
    draft:
      ru: "Черновик: размеры из data/canon.yaml (layout.*, exterior.*), не согласованы"
      en: "Draft: dimensions from data/canon.yaml (layout.*, exterior.*), not agreed"
