# Таблица строк для генерируемых графиков и страниц: ключ → {ru, en}.
# Подстановки в фигурных скобках ({gravity}, {radius}) заполняет скрипт значениями из canon/derived.

spin_vs_radius:
  title:
    ru: Обороты корабля при {gravity} на полу
    en: Ship spin rate for {gravity} at the floor
  xlabel:
    ru: Радиус пола от оси вращения, м
    en: Floor radius from spin axis, m
  ylabel:
    ru: Скорость вращения, об/мин
    en: Spin rate, rpm
  spec_point:
    ru: "SPEC: {radius}\n{rpm}"
    en: "SPEC: {radius}\n{rpm}"
  concept_point:
    ru: "CONCEPT: {radius}\n{rpm}"
    en: "CONCEPT: {radius}\n{rpm}"
  concept_band:
    ru: диапазон CONCEPT {range}
    en: CONCEPT range {range}
  formula:
    ru: "n = 60·√(a / r) / 2π,  a = {accel}"
    en: "n = 60·√(a / r) / 2π,  a = {accel}"

canon_groups:
  mission: {ru: Миссия, en: Mission}
  habitat: {ru: Жилой модуль, en: Habitat}
  ship: {ru: Вращение корабля, en: Ship spin}
  gravity: {ru: Искусственная тяжесть, en: Artificial gravity}
  maya: {ru: Майя, en: Maya}
  production: {ru: Производство, en: Production}
  series: {ru: Сериал, en: Series}
  physics: {ru: Физические константы и параметры, en: Physical constants and parameters}
  astro: {ru: Земля и Юпитер, en: Earth and Jupiter}
  reference: {ru: Реальные ориентиры, en: Real-world references}
  layout: {ru: Раскладка жилого модуля (черновик), en: Habitat layout (draft)}
  exterior: {ru: Внешний облик корабля (черновик), en: Ship exterior (draft)}

