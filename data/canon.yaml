      value: 2.6
      unit: м
      unit_en: m
      status: draft
      source: https://www.jpl.nasa.gov/news/juno-armored-up-to-go-to-jupiter
      note: Предложение, не согласовано. Диаметр сейфа ядра ARI, соосного хребту.
    power:
      value: [20, 50]
      unit: кВт
      unit_en: kW
      status: draft
      source: ru/90-reference/decisions.md §D-010
      note: >-
        Предложение, не согласовано. Электрическая мощность ядра: «десятки кВт» от реактора; тепло — по хребту
        на радиаторы.
    battery_energy:
      value: 100
      unit: кВт·ч
      unit_en: kWh
      status: draft
      source: null
      note: >-
        Предложение, не согласовано. Батарейный буфер ядра: ≈2 ч при 50 кВт или ≈5 ч при 20 кВт — переждать
        останов и перезапуск реактора.
    battery_station:
      value: [13.5, 15.0]
      unit: м
      unit_en: m
      status: draft
      source: null
      note: Предложение, не согласовано. Станции кольцевого блока батарей сразу за сейфом, перед баками.
    manual_breaker:
      station:
        value: 12
        unit: м
        unit_en: m
        status: draft
        source: ru/90-reference/decisions.md §D-010
        note: >-
          Предложение, не согласовано. Станция ручного механического рубильника питания ARI — у сейфа, в торце
          проходной фермы жилого модуля. Рядом силовые контакторы: их держит только жёсткий провод от
          ARI ISOLATE в кабине, без ПО в цепи.
      radius:
        value: 1.6
        unit: м
        unit_en: m
        status: draft
        source: ru/90-reference/decisions.md §D-010
        note: >-
          Предложение, не согласовано. Расстояние рубильника от оси вращения; тяжесть там ≈0,03 g — Майя
          добирается по ферме, где вес падает от 0,5 g почти до нуля.
