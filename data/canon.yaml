# Канонические входные значения вики Maya in Transit.
# Правит человек. Производные величины считает calc/derive.py → data/derived.yaml.
# После правки: uv run calc/derive.py && uv run tools/canon_sync.py --render && uv run tools/canon_sync.py --check
#
# Ключ = путь через точку (habitat.floor_radius). Лист — словарь с полем value.
#   value    число или [min, max] для диапазона
#   unit     русское сокращение ("" — безразмерная величина)
#   unit_en  английское сокращение
#   status   draft | proposed | canon | frozen (canon/frozen ставит только пользователь)
#   source   строка или список: "sources/<файл>.md §N", URL или название документа
#   note     примечание по-русски
#   format   необязательно: decimals (знаков после запятой), approx (префикс «≈»),
#            unit_space (пробел перед единицей; по умолчанию нет пробела для % ″ ′ °)

mission:
  crew:
    value: 1
    unit: чел.
    unit_en: person
    status: draft
    source:
      - sources/maya_ari_ship_3d_build_spec.md §шапка
      - sources/space_vlog_series_concept_v2.md §One-line pitch
    note: Одноместный корабль, на борту только Майя; ARI — бортовой ИИ без тела.
  era:
    value: [2050, 2059]
    unit: гг.
    unit_en: ""
    status: draft
    source:
      - sources/maya_ari_ship_3d_build_spec.md §шапка
      - sources/space_vlog_series_concept_v2.md §Mission architecture
    note: «2050-е» без точного года; год старта не задан.
  stasis_cruise:
    value: 3
    unit: года
    unit_en: years
    status: draft
    source: sources/space_vlog_series_concept_v2.md §Core principle
    note: >-
      Реплика Майи «a little over three years, depending on where you count it from» —
      нижняя граница. Точная длительность перелёта — только по расчёту траектории.
    format: {approx: true}

habitat:
  floor_gravity:
    value: 0.5
    unit: g
    unit_en: g
    status: draft
    source:
      - sources/maya_ari_ship_3d_build_spec.md §1.1
      - sources/maya_ari_ship_3d_build_spec.md §40
      - sources/space_vlog_series_concept_v2.md §Artificial gravity
    note: Целевая тяжесть на полу жилого модуля; в м/с² — производная habitat.floor_accel.
  floor_radius:
    value: 28
    unit: м
    unit_en: m
    status: proposed
    source:
      - sources/maya_ari_ship_3d_build_spec.md §1.1
      - sources/maya_ari_ship_3d_build_spec.md §40
      - sources/anatomy_prompts.md §Prompt 01
    note: >-
      Расстояние от оси вращения до пола. Конфликт C-001: CONCEPT даёт пример 25 м (4,23 об/мин)
      и диапазон 20–30 м; по иерархии канона побеждает SPEC — 28 м.
  floor_radius_concept:
    value: 25
    unit: м
    unit_en: m
    status: draft
    source: sources/space_vlog_series_concept_v2.md §Artificial gravity
    note: Вариант из CONCEPT (пример расчёта); проигрывает SPEC, хранится для сравнения (C-001).
  floor_radius_concept_range:
    value: [20, 30]
    unit: м
    unit_en: m
    status: draft
    source: sources/space_vlog_series_concept_v2.md §Artificial gravity
    note: «Для наглядного масштаба» по CONCEPT; 28 м из SPEC внутри диапазона.
  inner_diameter:
    value: 2.8
    unit: м
    unit_en: m
    status: draft
    source:
      - sources/maya_ari_ship_3d_build_spec.md §3
      - sources/anatomy_prompts.md §Prompt 03
    note: Внутренний диаметр гермооболочки, «approximate».
  inner_length:
    value: 6.0
    unit: м
    unit_en: m
    status: draft
    source:
      - sources/maya_ari_ship_3d_build_spec.md §3
      - sources/anatomy_prompts.md §Prompt 03
    note: Внутренняя длина гермооболочки; ось модуля параллельна оси вращения (SPEC §4, §8).
  usable_volume:
    value: [24, 28]
    unit: м³
    unit_en: m³
    status: draft
    source:
      - sources/maya_ari_ship_3d_build_spec.md §3
      - sources/maya_ari_ship_3d_build_spec.md §40
    note: Полезный объём для человека после стоек, баков, изоляции и оборудования.
  window_width:
    value: [0.8, 1.0]
    unit: м
    unit_en: m
    status: draft
    source: sources/maya_ari_ship_3d_build_spec.md §8
    note: Видимый проём осевого окна, ширина.
  window_height:
    value: [0.45, 0.65]
    unit: м
    unit_en: m
    status: draft
    source: sources/maya_ari_ship_3d_build_spec.md §8
    note: Видимый проём осевого окна, высота.
  display_primary:
    value: [32, 40]
    unit: ″
    unit_en: ″
    status: draft
    source:
      - sources/maya_ari_ship_3d_build_spec.md §6
      - sources/anatomy_prompts.md §Prompt 13
    note: Основной дисплей, диагональ «inch equivalent».
  display_secondary:
    value: [20, 27]
    unit: ″
    unit_en: ″
    status: draft
    source:
      - sources/maya_ari_ship_3d_build_spec.md §6
      - sources/anatomy_prompts.md §Prompt 13
    note: Вспомогательный дисплей, диагональ «inch equivalent».

maya:
  height:
    value: 1.7
    unit: м
    unit_en: m
    status: draft
    source: sources/anatomy_prompts.md §Prompt 18
    note: Эталонный рост для референс-листа Blender; в расчётах — высота головы над полом.
  age:
    value: [25, 33]
    unit: лет
    unit_en: years
    status: draft
    source: sources/space_vlog_series_concept_v2.md §The character
    note: Трактовка «mid-20s to early-30s»; точный возраст не задан.

production:
  blender_unit:
    value: 1
    unit: м
    unit_en: m
    status: draft
    source: sources/maya_ari_ship_3d_build_spec.md §35
    note: 1 единица Blender = 1 м.
  interior_cameras:
    value: 3
    unit: ""
    unit_en: ""
    status: draft
    source: sources/maya_ari_ship_3d_build_spec.md §26
    note: Камеры A (влог), B (общий план), C (крупный план у дисплея).
  exterior_camera_feeds:
    value: 5
    unit: ""
    unit_en: ""
    status: draft
    source: sources/maya_ari_ship_3d_build_spec.md §26
    note: Навигационная, кормовая, внешняя жилого модуля, инспекционная фермы, научная на Юпитер.
  blocking_positions:
    value: 6
    unit: ""
    unit_en: ""
    status: draft
    source:
      - sources/maya_ari_ship_3d_build_spec.md §37
      - sources/anatomy_prompts.md §Prompt 19
    note: Повторяемые позиции героини в кадре.

series:
  season1_episodes:
    value: 12
    unit: ""
    unit_en: ""
    status: draft
    source: sources/space_vlog_series_concept_v2.md §Season 1 — suggested 12 episodes
    note: Предложенное число эпизодов сезона 1 (Европа).
  short_duration:
    value: [30, 60]
    unit: с
    unit_en: s
    status: draft
    source: sources/space_vlog_series_concept_v2.md §Episode formula
    note: Длительность вертикального ролика 9:16.
  ep6_title_distance:
    value: 600
    unit: млн км
    unit_en: million km
    status: draft
    source: sources/space_vlog_series_concept_v2.md §Episode 6
    note: >-
      Из названия эпизода 6 («600 million kilometres from home»). CONCEPT требует пересчитать по траектории;
      попадает в диапазон Земля–Юпитер astro.earth_jupiter_distance.

physics:
  g_earth:
    value: 9.81
    unit: м/с²
    unit_en: m/s²
    status: draft
    source:
      - sources/maya_ari_ship_3d_build_spec.md §4
      - sources/space_vlog_series_concept_v2.md §Blender physics policy
    note: >-
      Округлённое земное ускорение, принятое в исходниках (4,905 = 0,5 × 9,81) и в Blender по умолчанию.
      Стандартное g₀ = 9,80665 м/с²; расхождение 0,03 % — несущественно.
  au:
    value: 149597870.7
    unit: км
    unit_en: km
    status: draft
    source: IAU 2012 Resolution B2
    note: Астрономическая единица, точное значение по определению.
  speed_of_light:
    value: 299792.458
    unit: км/с
    unit_en: km/s
    status: draft
    source: SI, определение метра
    note: Скорость света в вакууме, точное значение.
  walk_speed:
    value: 1
    unit: м/с
    unit_en: m/s
    status: draft
    source: null
    note: Расчётный параметр для оценки Кориолиса — спокойный шаг по кабине; не из исходников.

astro:
  earth_a:
    value: 1
    unit: а. е.
    unit_en: AU
    status: draft
    source: https://nssdc.gsfc.nasa.gov/planetary/factsheet/jupiterfact.html
    note: >-
      Модель: орбита Земли круговая, радиус 1 а. е. Реальный эксцентриситет Земли 0,0167
      (перигелий 147,095, афелий 152,100 млн км) в модели не учитывается.
  jupiter_a:
    value: 5.2038
    unit: а. е.
    unit_en: AU
    status: draft
    source: https://nssdc.gsfc.nasa.gov/planetary/factsheet/jupiterfact.html
    note: Большая полуось Юпитера, 778,479 млн км / 149,598 млн км (NSSDC, обновлено 2 окт. 2024).
  jupiter_e:
    value: 0.0487
    unit: ""
    unit_en: ""
    status: draft
    source: https://nssdc.gsfc.nasa.gov/planetary/factsheet/jupiterfact.html
    note: >-
      Эксцентриситет орбиты Юпитера по таблице NSSDC (0,0487; перигелий 740,595, афелий 816,363 млн км —
      согласуются). В постановке было 0,0489 (старая версия таблицы); средние элементы J2000 дают 0,0484.
  earth_jupiter_min_nssdc:
    value: 588.5
    unit: млн км
    unit_en: million km
    status: draft
    source: https://nssdc.gsfc.nasa.gov/planetary/factsheet/jupiterfact.html
    note: >-
      Теоретический минимум NSSDC: перигелий Юпитера минус афелий Земли. Для сверки с моделью;
      недостижим — направления перигелия Юпитера и афелия Земли не совпадают.
  earth_jupiter_max_nssdc:
    value: 968.5
    unit: млн км
    unit_en: million km
    status: draft
    source: https://nssdc.gsfc.nasa.gov/planetary/factsheet/jupiterfact.html
    note: Теоретический максимум NSSDC — афелий Юпитера плюс афелий Земли. Для сверки с моделью.

reference:
  ihab_volume:
    value: 10
    unit: м³
    unit_en: m³
    status: draft
    source: sources/maya_ari_ship_3d_build_spec.md §38
    note: >-
      ESA Lunar I-Hab — «roughly 10 m³» жилого модуля для экипажа Gateway; реальный ориентир для сравнения.
    format: {approx: true}
  clipper_cruise:
    value: 5.5
    unit: года
    unit_en: years
    status: draft
    source: sources/space_vlog_series_concept_v2.md §Long cruise times to Jupiter
    note: Перелёт Europa Clipper с гравманёврами у Марса и Земли; реальный ориентир.
    format: {approx: true}
  juice_cruise:
    value: 8
    unit: лет
    unit_en: years
    status: draft
    source: sources/space_vlog_series_concept_v2.md §Long cruise times to Jupiter
    note: Перелёт JUICE с несколькими гравманёврами; реальный ориентир.
    format: {approx: true}

# --- Раскладка интерьера (layout.*) и внешний облик (exterior.*) ---
# Черновик BLUEPRINT-2D от 2026-10-11: предложение, не согласовано. Читают figures/blueprints и навык anatomy.
# Локальная рамка жилого модуля (SPEC §4): X — вдоль модуля, +X к носу, X = 0 — середина внутренней длины;
#   Y — поперёк, +Y — влево, если смотреть в нос (правая тройка); Z = 0 — пол, +Z — к оси вращения.
# Станция хребта (exterior.*.station): расстояние вдоль хребта от носового конца к корме, м.
# Радиус — расстояние от оси вращения. Курс камеры (yaw) — угол в плане от +X к +Y.

layout:
  hull:
    floor_below_axis:
      value: 0.75
      unit: м
      unit_en: m
      status: draft
      source:
        - sources/maya_ari_ship_3d_build_spec.md §3
        - sources/maya_ari_ship_3d_build_spec.md §13
      note: >-
        Предложение, не согласовано. Плоская палуба ниже оси цилиндра модуля на эту величину: ось на высоте
        0,75 м над полом (Z = 0,75), свод 2,15 м, хорда палубы ≈2,36 м, подпольная полость 0,65 м по оси
        (геометрию считает генератор чертежей). Компромисс между высотой кабины и объёмом подпольных баков.
    floor_width:
      value: 2.0
      unit: м
      unit_en: m
      status: draft
      source: null
      note: >-
        Предложение, не согласовано. Чистая ширина пола главной кабины между вертикальными фасадами нижних
        шкафов (фасады при |Y| = 1,0 м). По ней ходит Майя; хорда палубы шире, ≈2,36 м.
    ceiling_height:
      value: 2.05
      unit: м
      unit_en: m
      status: draft
      source: sources/anatomy_prompts.md §Prompt 18
      note: >-
        Предложение, не согласовано. Чистая высота от пола до потолочной панели по оси кабины; над панелью до
        свода ≈0,10 м под свет, микрофоны ARI и воздуховоды. Запас над головой при росте 1,7 м — 0,35 м.
    underfloor_tank_height:
      value: 0.5
      unit: м
      unit_en: m
      status: draft
      source: sources/maya_ari_ship_3d_build_spec.md §13
      note: >-
        Предложение, не согласовано. Высота подпольных водяных баков по оси модуля (вода «в полу и структурных
        полостях», SPEC §13); бока баков повторяют обвод корпуса. Баки под главной кабиной и камбузом.
  lockers:
    depth:
      value: 0.35
      unit: м
      unit_en: m
      status: draft
      source:
        - sources/maya_ari_ship_3d_build_spec.md §14
        - sources/anatomy_prompts.md §Prompt 18
      note: >-
        Предложение, не согласовано. Глубина стеновых шкафов по горизонтали на высоте оси модуля; выше и ниже
        задняя стенка повторяет корпус. За шкафом до корпуса ≈5 см под кабели и изоляцию.
    front_height:
      value: 1.6
      unit: м
      unit_en: m
      status: draft
      source: null
      note: >-
        Предложение, не согласовано. Высота вертикальных фасадов нижних шкафов; выше — наклонные верхние
        шкафы, как багажные полки самолёта, до края потолочной панели.
  zones:
    window_bay:
      value: [2.6, 3.0]
      unit: м
      unit_en: m
      status: draft
      source: sources/maya_ari_ship_3d_build_spec.md §5
      note: >-
        Предложение, не согласовано. Диапазон X (лок. рамка: 0 — середина модуля, + к носу): носовая переборка
        с осевым окном и внутренней частью шторки, место «у окна» (позиция 3).
    main_cabin:
      value: [0.8, 2.6]
      unit: м
      unit_en: m
      status: draft
      source: sources/maya_ari_ship_3d_build_spec.md §5
      note: >-
        Предложение, не согласовано. Диапазон X главной рабочей и влоговой кабины: зона A — рабочее место у
        стены +Y (геройская стена), зона B — у стены −Y (назначение не определено).
    galley_storage:
      value: [0.0, 0.8]
      unit: м
      unit_en: m
      status: draft
      source:
        - sources/maya_ari_ship_3d_build_spec.md §5
        - sources/maya_ari_ship_3d_build_spec.md §9
      note: >-
        Предложение, не согласовано. Диапазон X: камбуз у стены +Y рядом с рабочим местом (SPEC §9), хранение
        у стены −Y. Часть одной открытой комнаты с главной кабиной.
    hygiene:
      value: [-1.1, 0.0]
      unit: м
      unit_en: m
      status: draft
      source:
        - sources/maya_ari_ship_3d_build_spec.md §5
        - sources/maya_ari_ship_3d_build_spec.md §10
      note: >-
        Предложение, не согласовано. Диапазон X закрываемой кабинки санузла у борта +Y (от прохода до корпуса).
        За ней, X −2,0…−1,1, — сервисная ниша перед стеной СЖО и медшкаф на борту.
    stasis:
      value: [-2.0, 0.0]
      unit: м
      unit_en: m
      status: draft
      source:
        - sources/maya_ari_ship_3d_build_spec.md §5
        - sources/maya_ari_ship_3d_build_spec.md §11
      note: >-
        Предложение, не согласовано. Диапазон X отсека SLEEP / MED / SAFE у борта −Y, койка вдоль X; сзади
        водяная часть стены СЖО, снизу подпольные баки — «самая защищённая часть» (SPEC §11, §13).
    eclss_wall:
      value: [-2.4, -2.0]
      unit: м
      unit_en: m
      status: draft
      source:
        - sources/maya_ari_ship_3d_build_spec.md §5
        - sources/maya_ari_ship_3d_build_spec.md §12
      note: >-
        Предложение, не согласовано. Диапазон X поперечной стены СЖО: обслуживаемые модули на половине +Y
        (лицом в сервисную нишу), вода на половине −Y (за отсеком стазиса), посередине дверной проём в тамбур.
    vestibule:
      value: [-3.0, -2.4]
      unit: м
      unit_en: m
      status: draft
      source: sources/maya_ari_ship_3d_build_spec.md §5
      note: >-
        Предложение, не согласовано. Диапазон X тамбура перед люком на ферму. По SPEC §5 люк в кормовой
        переборке (X = −3,0); вариант C-003 — люк в «потолке» над тамбуром.
  aisle_width:
    value: 0.7
    unit: м
    unit_en: m
    status: draft
    source: null
    note: >-
      Предложение, не согласовано. Ширина центрального прохода между санузлом и отсеком стазиса и дверного
      проёма в стене СЖО; без прохода корма с люком недостижима (план SPEC §5 его не рисует).
  desk:
    x:
      value: [1.0, 2.5]
      unit: м
      unit_en: m
      status: draft
      source: sources/maya_ari_ship_3d_build_spec.md §6
      note: Предложение, не согласовано. Диапазон X стола рабочего места у геройской стены (+Y); кресло по центру стола.
    depth:
      value: 0.55
      unit: м
      unit_en: m
      status: draft
      source: null
      note: Предложение, не согласовано. Глубина стола от фасада шкафов (|Y| = 1,0 м) к середине кабины.
    height:
      value: 0.74
      unit: м
      unit_en: m
      status: draft
      source: sources/anatomy_prompts.md §Prompt 18
      note: >-
        Предложение, не согласовано. Высота столешницы, обычная земная: при 0,5 g поза сидя та же, что на
        Земле (нейтральная поза невесомости не нужна).
  chair:
    seat_height:
      value: 0.45
      unit: м
      unit_en: m
      status: draft
      source: sources/anatomy_prompts.md §Prompt 18
      note: Предложение, не согласовано. Высота сиденья кресла рабочего места над полом, для роста 1,7 м.
  galley:
    counter_height:
      value: 0.9
      unit: м
      unit_en: m
      status: draft
      source: sources/maya_ari_ship_3d_build_spec.md §9
      note: Предложение, не согласовано. Высота столешницы камбуза — работа стоя.
    counter_depth:
      value: 0.6
      unit: м
      unit_en: m
      status: draft
      source: null
      note: Предложение, не согласовано. Глубина камбузной стены от фасада шкафов к середине кабины.
  window:
